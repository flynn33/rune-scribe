name: Version Bump and Changelog

# When a pull request is merged into main, bump the app version (MARKETING_VERSION
# patch + CURRENT_PROJECT_VERSION build number) in project.yml and the committed
# Xcode project, prepend a CHANGELOG.md entry, commit, and tag the release.
#
# Bump size is driven by PR labels: "major" / "minor" / "patch" (default patch).
# Add a "skip-release" label to merge without bumping. Versioning and changelog
# live in one workflow so the change is atomic and to avoid GitHub's rule that a
# GITHUB_TOKEN push does not trigger another workflow (a separate changelog
# workflow keyed on the tag/commit would never fire).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and update changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # User-controlled values via env (never interpolated into the script).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -u

          # --- Determine bump type from PR labels -----------------------------
          LABELS="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null | tr '\n' ' ' || true)"
          case " $LABELS " in
            *" skip-release "*|*" no-release "*) echo "skip-release label present; nothing to do."; exit 0 ;;
          esac
          BUMP=patch
          case " $LABELS " in
            *" major "*|*" release:major "*) BUMP=major ;;
            *" minor "*|*" release:minor "*) BUMP=minor ;;
          esac

          # --- Compute new versions -------------------------------------------
          CUR="$(grep -m1 -E 'MARKETING_VERSION:' project.yml | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"?([0-9]+(\.[0-9]+)*)"?.*/\1/')"
          IFS='.' read -r MA MI PA <<< "$CUR"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEW="$MA.$MI.$PA"

          CURB="$(grep -m1 -E 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*CURRENT_PROJECT_VERSION:[[:space:]]*"?([0-9]+)"?.*/\1/')"
          NEWB=$(( ${CURB:-0} + 1 ))

          echo "Bump: $BUMP   marketing $CUR -> $NEW   build $CURB -> $NEWB"

          # --- Update project.yml (source of truth) ---------------------------
          sed -i -E "s/(MARKETING_VERSION:[[:space:]]*)\"?[0-9.]+\"?/\1\"$NEW\"/" project.yml
          sed -i -E "s/(CURRENT_PROJECT_VERSION:[[:space:]]*)\"?[0-9]+\"?/\1\"$NEWB\"/" project.yml

          # --- Update the committed Xcode project to stay in sync -------------
          PBX=RuneScrib.xcodeproj/project.pbxproj
          if [ -f "$PBX" ]; then
            sed -i -E "s/(MARKETING_VERSION = )\"?[0-9.]+\"?;/\1$NEW;/g" "$PBX"
            sed -i -E "s/(CURRENT_PROJECT_VERSION = )\"?[0-9]+\"?;/\1$NEWB;/g" "$PBX"
          fi

          # --- Prepend a changelog entry --------------------------------------
          DATE="$(date -u +%Y-%m-%d)"
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog\n\n<!-- NEW ENTRIES BELOW -->\n' > CHANGELOG.md
          fi
          TMP="$(mktemp)"
          {
            printf '## [%s] - %s\n\n' "$NEW" "$DATE"
            printf -- '- %s (#%s) by @%s\n\n' "$PR_TITLE" "$PR_NUMBER" "$PR_AUTHOR"
          } > "$TMP"
          sed -i "/<!-- NEW ENTRIES BELOW -->/r $TMP" CHANGELOG.md
          rm -f "$TMP"

          # --- Commit, tag, push ----------------------------------------------
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml CHANGELOG.md "$PBX" 2>/dev/null || git add project.yml CHANGELOG.md
          git commit -m "chore(release): v$NEW (build $NEWB) [skip ci]"
          git tag "v$NEW" || true
          git push origin HEAD:main
          git push origin "v$NEW" || true

          echo "Released v$NEW (build $NEWB)."
