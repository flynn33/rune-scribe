name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Run architecture guardrails
        run: bash scripts/check-architecture.sh

      - name: Install Metal toolchain if missing
        run: xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -2 || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS unit tests (ad-hoc signing)
        run: |
          set +e
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-macOS \
            -destination 'platform=macOS' test \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS="" \
            > macos-test.log 2>&1
          status=$?
          tail -60 macos-test.log
          if [ $status -ne 0 ]; then
            echo "::group::compiler / test errors"
            grep -nE ": error:|fatal error:|Testing failed|failed \(" macos-test.log | head -80
            echo "::endgroup::"
          fi
          exit $status

      - name: Build iOS target (simulator, compile-check iOS-only code)
        run: |
          set +e
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-iOS \
            -destination 'generic/platform=iOS Simulator' build \
            CODE_SIGNING_ALLOWED=NO > ios-build.log 2>&1
          status=$?
          tail -40 ios-build.log
          if [ $status -ne 0 ]; then
            echo "::group::iOS compiler errors"
            grep -nE ": error:|fatal error:" ios-build.log | head -80
            echo "::endgroup::"
          fi
          exit $status
