name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  macos-unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install Metal toolchain if missing
        run: xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -2 || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS unit tests (ad-hoc signing)
        run: |
          set -o pipefail
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-macOS \
            -destination 'platform=macOS' test \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tail -120
