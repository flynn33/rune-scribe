name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          selected="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.2*.app' -print | sort | head -1)"
          if [ -n "$selected" ]; then
            export DEVELOPER_DIR="$selected/Contents/Developer"
          elif xcodebuild -version | grep -Fxq 'Xcode 26.2'; then
            export DEVELOPER_DIR="$(xcode-select -p)"
          else
            echo 'Xcode 26.2 is required for deterministic verification.' >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -Fxq 'Xcode 26.2'
          xcodebuild -version | grep -Fxq 'Build version 17C52'

      - name: Run architecture guardrails
        run: bash scripts/check-architecture.sh

      - name: Run Swift package tests
        run: swift test --package-path Packages/RuneScribeArchitecture

      - name: Install Metal toolchain if missing
        run: xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -2 || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen --version)" = 'Version: 2.46.0'

      - name: Verify reproducible Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- RuneScrib.xcodeproj Config
          test -z "$(git status --porcelain --untracked-files=all -- RuneScrib.xcodeproj Config)"
          xcodegen generate
          git diff --exit-code -- RuneScrib.xcodeproj Config
          test -z "$(git status --porcelain --untracked-files=all -- RuneScrib.xcodeproj Config)"

      - name: Run macOS unit tests (ad-hoc signing)
        run: |
          set +e
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-macOS \
            -destination 'platform=macOS' test \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS="" \
            > macos-test.log 2>&1
          status=$?
          tail -60 macos-test.log
          if [ $status -ne 0 ]; then
            echo "::group::compiler / test errors"
            grep -nE ": error:|fatal error:|Testing failed|failed \(" macos-test.log | head -80
            echo "::endgroup::"
          fi
          exit $status

      - name: Run prompt-proof macOS parity hosted unit tests (in-memory)
        run: |
          set +e
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-macOS-Parity \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/RuneScribe-macOS-parity" test \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="" \
            > macos-parity-test.log 2>&1
          status=$?
          tail -80 macos-parity-test.log
          if [ $status -ne 0 ]; then
            echo "::group::macOS parity compiler / unit test errors"
            grep -nE ": error:|fatal error:|Testing failed|failed \(" \
              macos-parity-test.log | head -100
            echo "::endgroup::"
          fi
          exit $status

      - name: Run prompt-proof macOS native share presentation self-test
        run: |
          scripts/check-macos-native-share.sh \
            "$RUNNER_TEMP/RuneScribe-macOS-parity/Build/Products/Debug/RuneScribMacParityHost.app" \
            "$RUNNER_TEMP/RuneScribe-macOS-native-share.json"

      - name: Build iOS target (simulator, compile-check iOS-only code)
        run: |
          set +e
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-iOS \
            -destination 'generic/platform=iOS Simulator' build \
            CODE_SIGNING_ALLOWED=NO > ios-build.log 2>&1
          status=$?
          tail -40 ios-build.log
          if [ $status -ne 0 ]; then
            echo "::group::iOS compiler errors"
            grep -nE ": error:|fatal error:" ios-build.log | head -80
            echo "::endgroup::"
          fi
          exit $status

      - name: Run iOS-hosted tests
        run: |
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; values = json.load(sys.stdin)["runtimes"]; matches = [item["identifier"] for item in values if item.get("name") == "iOS 26.2" and item.get("isAvailable")]; print(matches[0] if len(matches) == 1 else "")')"
          device_type_id="$(xcrun simctl list devicetypes -j | python3 -c 'import json, sys; values = json.load(sys.stdin)["devicetypes"]; matches = [item["identifier"] for item in values if item.get("name") == "iPhone 17 Pro"]; print(matches[0] if len(matches) == 1 else "")')"
          test -n "$runtime_id"
          test -n "$device_type_id"
          simulator_id="$(xcrun simctl create 'Rune Scribe iOS Hosted' "$device_type_id" "$runtime_id")"
          trap 'xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true' EXIT
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-iOS \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/RuneScribe-iOS-hosted" test \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="9AQ2C2838M"

      - name: Run isolated iOS parity UI tests
        run: |
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; values = json.load(sys.stdin)["runtimes"]; matches = [item["identifier"] for item in values if item.get("name") == "iOS 26.2" and item.get("isAvailable")]; print(matches[0] if len(matches) == 1 else "")')"
          device_type_id="$(xcrun simctl list devicetypes -j | python3 -c 'import json, sys; values = json.load(sys.stdin)["devicetypes"]; matches = [item["identifier"] for item in values if item.get("name") == "iPhone 17 Pro"]; print(matches[0] if len(matches) == 1 else "")')"
          test -n "$runtime_id"
          test -n "$device_type_id"
          simulator_id="$(xcrun simctl create 'Rune Scribe iOS Parity' "$device_type_id" "$runtime_id")"
          trap 'xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true' EXIT
          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-iOS-Parity \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/RuneScribe-iOS-parity" test \
            RUNESCRIBE_APP_BUNDLE_IDENTIFIER=com.runescribe.app.p7uitest \
            CODE_SIGN_ENTITLEMENTS="" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM=""

      - name: Verify Release shipping products
        run: |
          macos_derived_data="$RUNNER_TEMP/RuneScribe-Release-macOS"
          ios_derived_data="$RUNNER_TEMP/RuneScribe-Release-iOS"

          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-macOS \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$macos_derived_data" build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM=""

          xcodebuild -project RuneScrib.xcodeproj -scheme RuneScrib-iOS \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$ios_derived_data" build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM=""

          scripts/check-shipping-products.sh \
            --macos-app "$macos_derived_data/Build/Products/Release/RuneScrib.app" \
            --ios-app "$ios_derived_data/Build/Products/Release-iphonesimulator/RuneScrib.app"
