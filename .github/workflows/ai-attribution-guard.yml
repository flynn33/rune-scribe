name: AI Attribution Guard

# Rejects any pull request that carries AI attribution of any kind — in added
# content, commit messages, the PR title/body, changed file names, or the branch
# name. It targets *attribution* (crediting an AI tool/assistant for the work),
# not the app's legitimate product references to AI models (e.g. "share the
# cipher with an AI model"), which are allowed by design.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Scan for AI attribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # User-controlled values are passed through the environment (never
          # interpolated into the script) so they cannot inject shell commands.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u

          # --- Patterns -------------------------------------------------------
          # ATTRIB: authorship-credit phrases. Matched in commit messages, the PR
          # title/body, and added diff lines. Crafted NOT to match bare model
          # names (so product copy mentioning "an AI model (Claude, ChatGPT...)"
          # passes), only explicit attribution.
          ATTRIB='co-?authored-?by:.*(claude|chatgpt|gpt|openai|anthropic|copilot|codex|gemini|bard|cursor|codeium|aider|devin|cody|tabnine|sourcery)'
          ATTRIB="$ATTRIB"'|(generated|produced|written|authored|created) (with|by) .*(claude|chatgpt|gpt|openai|anthropic|copilot|codex|gemini|cursor|codeium|cody|\bai\b|assistant|language model|llm)'
          ATTRIB="$ATTRIB"'|🤖'
          ATTRIB="$ATTRIB"'|noreply@anthropic\.com'
          ATTRIB="$ATTRIB"'|\b(ai|machine|llm)[ _-]?(generated|assisted|authored|written|produced)\b'
          ATTRIB="$ATTRIB"'|with (the )?(help|assistance) of (an? )?(ai|claude|chatgpt|gpt|copilot|gemini|llm|language model)'
          ATTRIB="$ATTRIB"'|prompted (with|using|by) (claude|chatgpt|gpt|copilot|an? ai)'

          # SLUGS: AI tool / vendor names. Matched in branch names and file paths
          # (an artifact named after an AI tool is itself attribution). Token-
          # bounded to avoid false positives in ordinary words.
          SLUGS='(^|[/_.-])(claude|chatgpt|openai|anthropic|copilot|codex|gemini|codeium|aider|devin|cody|tabnine|sweep|sourcery-ai|google-labs-jules)([/_.-]|$)'
          SLUGS="$SLUGS"'|🤖'
          SLUGS="$SLUGS"'|ai[_-](generated|assisted|authored|written)'

          fail=0
          report() { echo "::error::$1"; fail=1; }

          # --- 1) Branch name -------------------------------------------------
          if printf '%s' "$HEAD_REF" | grep -qiE "$SLUGS"; then
            report "Branch name '$HEAD_REF' looks like AI-tool attribution."
          fi

          # --- 2) Changed file paths ------------------------------------------
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' > files.txt 2>/dev/null || true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if printf '%s' "$f" | grep -qiE "$SLUGS"; then
              report "File path '$f' looks like AI-tool attribution."
            fi
          done < files.txt

          # --- 3) Commit messages ---------------------------------------------
          gh pr view "$PR_NUMBER" --json commits \
            --jq '.commits[] | .messageHeadline, .messageBody' > commits.txt 2>/dev/null || true
          if grep -qiE "$ATTRIB" commits.txt; then
            report "A commit message contains AI attribution. Offending lines:"
            grep -inE "$ATTRIB" commits.txt | head -20 | sed 's/^/    /' || true
          fi

          # --- 4) PR title and body -------------------------------------------
          { printf '%s\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY"; } > meta.txt
          if grep -qiE "$ATTRIB" meta.txt; then
            report "The PR title or description contains AI attribution."
          fi

          # --- 5) Added lines in the diff -------------------------------------
          # Exclude this guard's own file, whose pattern strings would otherwise
          # match themselves.
          gh pr diff "$PR_NUMBER" --patch > pr.diff 2>/dev/null || true
          awk '
            /^\+\+\+ / { p=$0; sub(/^\+\+\+ b\//,"",p) }
            /^\+/ && !/^\+\+\+/ {
              if (p !~ /\.github\/workflows\/ai-attribution-guard\.yml$/) print
            }
          ' pr.diff > added.txt
          if grep -qiE "$ATTRIB" added.txt; then
            report "Added content contains AI attribution. Offending lines:"
            grep -inE "$ATTRIB" added.txt | head -20 | sed 's/^/    /' || true
          fi

          # --- Verdict --------------------------------------------------------
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "This repository does not accept AI attribution of any kind."
            echo "Remove it from the branch name, file names, commit messages, PR"
            echo "description, and code, then update the pull request."
            exit 1
          fi
          echo "No AI attribution detected."
