name: RuneScrib
options:
  bundleIdPrefix: com.runescribe
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.9"
    CURRENT_PROJECT_VERSION: "10"
    PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app
    INFOPLIST_KEY_CFBundleDisplayName: Rune-Scribe
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    DEAD_CODE_STRIPPING: YES
    # Hardened Runtime on for distribution (App Store / notarization). Debug builds
    # still get `get-task-allow`, so local ad-hoc runs and tests work.
    ENABLE_HARDENED_RUNTIME: YES
    # Base identity is ad-hoc (used by the test bundle); the app targets override
    # with the developer team's automatic signing below.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  RuneScrib-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScrib
    settings:
      base:
        PRODUCT_NAME: RuneScrib
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Raven Forge Software"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        # App Sandbox is mandatory for the Mac App Store. The user-selected
        # read-write entitlement lets the decoder export/import file panels work
        # inside the sandbox. Signed with the developer team's automatic signing.
        CODE_SIGN_ENTITLEMENTS: Config/RuneScrib-macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
  RuneScrib-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RuneScrib
    settings:
      base:
        PRODUCT_NAME: RuneScrib
        TARGETED_DEVICE_FAMILY: "1,2"
        # iPad must declare all four orientations (or require full screen) to avoid
        # the "All interface orientations must be supported" warning.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Config/RuneScrib-iOS.entitlements
        # Signed with the developer team's automatic signing. Xcode provisions the
        # keychain-access-groups entitlement automatically; $(AppIdentifierPrefix)
        # in the entitlements file resolves to this team's prefix.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
  RuneScribTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScribTests
    dependencies:
      - target: RuneScrib-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RuneScrib.app/Contents/MacOS/RuneScrib"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RuneScrib-macOS:
    build:
      targets:
        RuneScrib-macOS: all
    test:
      targets:
        - RuneScribTests
  RuneScrib-iOS:
    build:
      targets:
        RuneScrib-iOS: all
