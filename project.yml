name: RuneScrib
options:
  xcodeVersion: "26.2"
  bundleIdPrefix: com.runescribe
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.40"
    CURRENT_PROJECT_VERSION: "40"
    RUNESCRIBE_APP_BUNDLE_IDENTIFIER: com.runescribe.app
    PRODUCT_BUNDLE_IDENTIFIER: "$(RUNESCRIBE_APP_BUNDLE_IDENTIFIER)"
    INFOPLIST_KEY_CFBundleDisplayName: "Rune Scribe"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    DEAD_CODE_STRIPPING: YES
    # Hardened Runtime on for distribution (App Store / notarization). Debug builds
    # still get `get-task-allow`, so local ad-hoc runs and tests work.
    ENABLE_HARDENED_RUNTIME: YES
    # Keep an ad-hoc fallback for non-hosted utility targets. App and hosted test
    # targets use the developer team's automatic signing below.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  RuneScribeArchitecture:
    path: Packages/RuneScribeArchitecture
targets:
  RuneScrib-macOS:
    type: application
    productName: RuneScrib
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScrib/AppHost
      - path: RuneScrib/Metal/Shaders.metal
      - path: RuneScrib/Resources
    dependencies:
      - package: RuneScribeArchitecture
        product: RuneScribeContracts
      - package: RuneScribeArchitecture
        product: RuneScribeRuntimeCore
      - package: RuneScribeArchitecture
        product: RuneScribeUIRuntime
      - package: RuneScribeArchitecture
        product: RuneScribePlatform
      - package: RuneScribeArchitecture
        product: RuneScribeCoreModule
      - package: RuneScribeArchitecture
        product: RuneScribeProgressionModule
      - package: RuneScribeArchitecture
        product: RuneScribeNorseThemeModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeMoonleafModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeSunspireModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeWildwoodModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeGloamthornModule
      - package: RuneScribeArchitecture
        product: RuneScribeCloudSyncModule
      - package: RuneScribeArchitecture
        product: RuneScribeGameCenterModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeCoordinatorModule
      - package: RuneScribeArchitecture
        product: RuneScribeUIModule
    # An explicit, XcodeGen-managed Info.plist is required because the
    # runescribe:// URL scheme is a nested array that GENERATE_INFOPLIST_FILE can't
    # express. Keys previously set via INFOPLIST_KEY_* are migrated here.
    info:
      path: Config/RuneScrib-macOS-Info.plist
      properties:
        CFBundleDisplayName: "Rune Scribe"
        # Track the build settings so the shipped version stays current with the
        # release bump, instead of XcodeGen's literal "1.0"/"1" defaults.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.lifestyle
        NSHumanReadableCopyright: "© Raven Forge Software"
        NSContactsUsageDescription: "Rune Scribe can organize your ciphers by contact. Contacts stay on your device, encrypted, and are never uploaded."
        CFBundleURLTypes:
          - CFBundleURLName: com.runescribe.import
            CFBundleURLSchemes: [runescribe]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.runescribe.runescribe
            UTTypeDescription: "Rune Scribe Cipher/Message"
            UTTypeConformsTo: [public.content, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [runescribe]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Rune Scribe File"
            LSItemContentTypes: [com.runescribe.runescribe]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    entitlements:
      path: Config/RuneScrib-macOS.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.runescribe.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.runescribe.app"
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: RuneScrib
        # info: above supplies the Info.plist; disable the generated one to avoid
        # "Multiple commands produce Info.plist".
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        # App Sandbox is mandatory for the Mac App Store. The user-selected
        # read-write entitlement lets the decoder export/import file panels work
        # inside the sandbox. Signed with the developer team's automatic signing.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
        # Keep Xcode's capability model authoritative so regenerating the project
        # preserves the sandbox, Contacts, and user-selected file access.
        ENABLE_APP_SANDBOX: YES
        ENABLE_RESOURCE_ACCESS_CONTACTS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
      configs:
        Debug:
          # Hosted XCTest and the app must have the same signing identity. Keep
          # local/CI Debug builds ad-hoc so tests never wait on a user Keychain.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        Release:
          # Preserve only the reviewed source entitlements in signed Release
          # products; development signing otherwise injects get-task-allow.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
  RuneScrib-iOS:
    type: application
    productName: RuneScrib
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RuneScrib/AppHost
      - path: RuneScrib/Metal/Shaders.metal
      - path: RuneScrib/Resources
    dependencies:
      - package: RuneScribeArchitecture
        product: RuneScribeContracts
      - package: RuneScribeArchitecture
        product: RuneScribeRuntimeCore
      - package: RuneScribeArchitecture
        product: RuneScribeUIRuntime
      - package: RuneScribeArchitecture
        product: RuneScribePlatform
      - package: RuneScribeArchitecture
        product: RuneScribeCoreModule
      - package: RuneScribeArchitecture
        product: RuneScribeProgressionModule
      - package: RuneScribeArchitecture
        product: RuneScribeNorseThemeModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeMoonleafModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeSunspireModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeWildwoodModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeGloamthornModule
      - package: RuneScribeArchitecture
        product: RuneScribeCloudSyncModule
      - package: RuneScribeArchitecture
        product: RuneScribeGameCenterModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeCoordinatorModule
      - package: RuneScribeArchitecture
        product: RuneScribeUIModule
    # An explicit, XcodeGen-managed Info.plist is required because the
    # runescribe:// URL scheme is a nested array that GENERATE_INFOPLIST_FILE can't
    # express, and the camera scanner needs NSCameraUsageDescription. Keys
    # previously set via INFOPLIST_KEY_* are migrated here verbatim.
    info:
      path: Config/RuneScrib-iOS-Info.plist
      properties:
        CFBundleDisplayName: "Rune Scribe"
        # Track the build settings so the shipped version stays current with the
        # release bump, instead of XcodeGen's literal "1.0"/"1" defaults.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.lifestyle
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # iPad must declare all four orientations (or require full screen) to avoid
        # the "All interface orientations must be supported" warning.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Rune Scribe uses the camera to scan a cipher QR code so you can import it. Frames are processed on-device and never saved or sent anywhere."
        NSContactsUsageDescription: "Rune Scribe can organize your ciphers by contact. Contacts stay on your device, encrypted, and are never uploaded."
        # An incoming .runescribe file is copied in (not opened in place): the app reads
        # its bytes and imports, never editing the sender's original. Declaring this
        # resolves the iOS "supports opening files in place?" build advisory.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: com.runescribe.import
            CFBundleURLSchemes: [runescribe]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.runescribe.runescribe
            UTTypeDescription: "Rune Scribe Cipher/Message"
            UTTypeConformsTo: [public.content, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [runescribe]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Rune Scribe File"
            LSItemContentTypes: [com.runescribe.runescribe]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    entitlements:
      path: Config/RuneScrib-iOS.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.runescribe.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.runescribe.app"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.runescribe.app"
    settings:
      base:
        PRODUCT_NAME: RuneScrib
        # info: above supplies the Info.plist; disable the generated one to avoid
        # "Multiple commands produce Info.plist".
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # Signed with the developer team's automatic signing. Xcode provisions the
        # keychain-access-groups entitlement automatically; $(AppIdentifierPrefix)
        # in the entitlements file resolves to this team's prefix.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
  RuneScribTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScribTests
      - path: Packages/RuneScribeArchitecture/Tests/RuneScribeCoreModuleTests/Domain/DestinationCompatibilityMatrixTests.swift
        group: CompatibilityMatrix
    dependencies:
      - target: RuneScrib-macOS
      - package: RuneScribeArchitecture
        product: RuneScribeTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RuneScrib.app/Contents/MacOS/RuneScrib"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Match the signed test host. An ad-hoc test bundle cannot be loaded into
        # an Apple Development-signed host because their Team IDs differ.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
  RuneScribIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RuneScribIOSTests
      - path: ThemeFidelityTests
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Canonical-Render-Catalog-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Deterministic-Seed-Catalog-v1.3.json
        buildPhase: resources
      - path: Packages/RuneScribeArchitecture/Tests/RuneScribeCoreModuleTests/Domain/DestinationCompatibilityMatrixTests.swift
        group: CompatibilityMatrix
    dependencies:
      - target: RuneScrib-iOS
      - package: RuneScribeArchitecture
        product: RuneScribeTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.ios-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RuneScrib.app/RuneScrib"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
  RuneScribIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RuneScribIOSUITests
      - path: ThemeFidelityXCUITests
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Comparison-Authority-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Responsive-Candidate-Catalog-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Deterministic-Seed-Catalog-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Runtime-Probe-Catalog-v1.3.json
        buildPhase: resources
    dependencies:
      - target: RuneScrib-iOS
      - package: RuneScribeArchitecture
        product: RuneScribeNorseThemeModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeMoonleafModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeSunspireModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeWildwoodModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeGloamthornModule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.ios-ui-tests
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "9AQ2C2838M"
  RuneScribMacParityHost:
    type: application
    productName: RuneScribMacParityHost
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScribMacParityHost
      - path: RuneScrib/AppHost/RuneScribeRuntimeComposition.swift
    dependencies:
      - package: RuneScribeArchitecture
        product: RuneScribeContracts
      - package: RuneScribeArchitecture
        product: RuneScribeRuntimeCore
      - package: RuneScribeArchitecture
        product: RuneScribeUIRuntime
      - package: RuneScribeArchitecture
        product: RuneScribeCoreModule
      - package: RuneScribeArchitecture
        product: RuneScribeProgressionModule
      - package: RuneScribeArchitecture
        product: RuneScribeCloudSyncModule
      - package: RuneScribeArchitecture
        product: RuneScribeGameCenterModule
      - package: RuneScribeArchitecture
        product: RuneScribeNorseThemeModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeMoonleafModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeSunspireModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeWildwoodModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeGloamthornModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeCoordinatorModule
      - package: RuneScribeArchitecture
        product: RuneScribePlatform
      - package: RuneScribeArchitecture
        product: RuneScribeUIModule
    info:
      path: RuneScribMacParityHost/Info.plist
      properties:
        CFBundleDisplayName: "Rune Scribe Parity Host"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.runescribe.runescribe
            UTTypeDescription: "Rune Scribe Cipher/Message"
            UTTypeConformsTo: [public.content, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [runescribe]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Rune Scribe File"
            LSItemContentTypes: [com.runescribe.runescribe]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.macos-parity-host
        PRODUCT_NAME: RuneScribMacParityHost
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_TESTABILITY: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  RuneScribMacParityTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScribMacParityTests
      - path: ThemeFidelityTests
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Canonical-Render-Catalog-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Deterministic-Seed-Catalog-v1.3.json
        buildPhase: resources
      - path: Packages/RuneScribeArchitecture/Tests/RuneScribeCoreModuleTests/Domain/DestinationCompatibilityMatrixTests.swift
        group: CompatibilityMatrix
    dependencies:
      - target: RuneScribMacParityHost
      - package: RuneScribeArchitecture
        product: RuneScribeNorseThemeModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeMoonleafModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeSunspireModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeWildwoodModule
      - package: RuneScribeArchitecture
        product: RuneScribeThemeGloamthornModule
      - package: RuneScribeArchitecture
        product: RuneScribeTestSupport
      - package: RuneScribeArchitecture
        product: RuneScribeThemeCoordinatorModule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.macos-parity-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RuneScribMacParityHost.app/Contents/MacOS/RuneScribMacParityHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  RuneScribMacParityUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ThemeFidelityXCUITests
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Comparison-Authority-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Responsive-Candidate-Catalog-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Deterministic-Seed-Catalog-v1.3.json
        buildPhase: resources
      - path: docs/verification/theme-fidelity-v4-3/authority/03-COMPARISON-AUTHORITY/Runtime-Probe-Catalog-v1.3.json
        buildPhase: resources
    dependencies:
      - target: RuneScribMacParityHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.macos-parity-ui-tests
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  RuneScribArchitectureTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuneScribArchitectureTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runescribe.app.architecture-tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  RuneScrib-macOS:
    build:
      targets:
        RuneScrib-macOS: all
    test:
      targets:
        - RuneScribTests
        - RuneScribArchitectureTests
  RuneScrib-iOS:
    build:
      targets:
        RuneScrib-iOS: all
    test:
      targets:
        - RuneScribIOSTests
  RuneScrib-iOS-Parity:
    build:
      targets:
        RuneScrib-iOS: all
    test:
      environmentVariables:
        RUNESCRIBE_THEME_FIDELITY_CANONICAL_CANDIDATE: "$(RUNESCRIBE_THEME_FIDELITY_CANONICAL_CANDIDATE)"
        RUNESCRIBE_THEME_FIDELITY_CANONICAL_ROOT: "$(RUNESCRIBE_THEME_FIDELITY_CANONICAL_ROOT)"
        RUNESCRIBE_THEME_FIDELITY_SOURCE_SHA: "$(RUNESCRIBE_THEME_FIDELITY_SOURCE_SHA)"
      targets:
        - RuneScribIOSTests
        - RuneScribIOSUITests
  RuneScrib-macOS-Parity:
    build:
      targets:
        RuneScribMacParityHost: all
        RuneScribMacParityTests: [test]
    test:
      environmentVariables:
        RUNESCRIBE_THEME_FIDELITY_CANONICAL_CANDIDATE: "$(RUNESCRIBE_THEME_FIDELITY_CANONICAL_CANDIDATE)"
        RUNESCRIBE_THEME_FIDELITY_CANONICAL_ROOT: "$(RUNESCRIBE_THEME_FIDELITY_CANONICAL_ROOT)"
        RUNESCRIBE_THEME_FIDELITY_SOURCE_SHA: "$(RUNESCRIBE_THEME_FIDELITY_SOURCE_SHA)"
      targets:
        - RuneScribMacParityTests
  RuneScrib-Theme-Fidelity-iOS-XCUI:
    build:
      targets:
        RuneScrib-iOS: all
        RuneScribIOSUITests: [test]
    test:
      config: Release
      environmentVariables:
        RUNESCRIBE_XCUI_ENTRY_FILTER: "$(RUNESCRIBE_XCUI_ENTRY_FILTER)"
      targets:
        - RuneScribIOSUITests
  RuneScrib-Theme-Fidelity-macOS-XCUI:
    build:
      targets:
        RuneScribMacParityHost: all
        RuneScribMacParityUITests: [test]
    test:
      config: Release
      environmentVariables:
        RUNESCRIBE_XCUI_ENTRY_FILTER: "$(RUNESCRIBE_XCUI_ENTRY_FILTER)"
      targets:
        - RuneScribMacParityUITests
